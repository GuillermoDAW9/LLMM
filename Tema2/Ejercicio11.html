<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes Responsiva</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <a href="#inicio" class="active">Inicio</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
    </div>

    <div class="main-content">
        <h1>Mi Galería de Imágenes</h1>
        <p>Explora algunas fotos interesantes.</p>

        <div class="gallery-container">

            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://via.placeholder.com/600/FF0000/FFFFFF?text=Imagen+1">
                        <img src="https://via.placeholder.com/400/FF0000/FFFFFF?text=Imagen+1" alt="Imagen 1" width="600" height="400">
                    </a>
                    <div class="desc">Una hermosa imagen con un toque rojo.</div>
                </div>
            </div>

            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://via.placeholder.com/600/00FF00/FFFFFF?text=Imagen+2">
                        <img src="https://via.placeholder.com/400/00FF00/FFFFFF?text=Imagen+2" alt="Imagen 2" width="600" height="400">
                    </a>
                    <div class="desc">Verde que te quiero verde.</div>
                </div>
            </div>

            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://via.placeholder.com/600/0000FF/FFFFFF?text=Imagen+3">
                        <img src="https://via.placeholder.com/400/0000FF/FFFFFF?text=Imagen+3" alt="Imagen 3" width="600" height="400">
                    </a>
                    <div class="desc">El azul del cielo en una foto.</div>
                </div>
            </div>

            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://via.placeholder.com/600/FFFF00/000000?text=Imagen+4">
                        <img src="https://via.placeholder.com/400/FFFF00/000000?text=Imagen+4" alt="Imagen 4" width="600" height="400">
                    </a>
                    <div class="desc">Brillante como el sol.</div>
                </div>
            </div>
            
            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://via.placeholder.com/600/FFA500/FFFFFF?text=Imagen+5">
                        <img src="https://via.placeholder.com/400/FFA500/FFFFFF?text=Imagen+5" alt="Imagen 5" width="600" height="400">
                    </a>
                    <div class="desc">Un vibrante toque naranja.</div>
                </div>
            </div>

            <div class="clearfix"></div> </div> </div> </body>
</html>
