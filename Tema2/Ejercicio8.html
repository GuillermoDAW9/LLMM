<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de Position Absolute</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <h2>Contenedor Relativo</h2>
        <p>Este texto está en el flujo normal, dentro del contenedor que sirve de referencia.</p>
        
        <div class="caja caja-superior-derecha">
            Caja A (top: 10px, right: 10px)
        </div>
        
        <div class="caja caja-inferior-izquierda">
            Caja B (bottom: 20px, left: 5%)
        </div>

        <div class="caja caja-superpuesta">
            Caja C (z-index: 10)
        </div>

    </div>

</body>
</html>
