<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fútbol Quiz - Kahoot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="contenedor-principal">
        <div id="inicio">
            <h1>🏆 FÚTBOL QUIZ 🏆</h1>
            <p>¿Podrás acertar las 20 preguntas?</p>
            <button id="boton-jugar" onclick="comenzar()">¡JUGAR!</button>
        </div>

        <div id="juego" class="oculto">
            <div class="info-superior">
                <div id="numero-pregunta">Pregunta: 1 / 20</div>
                <div id="marcador">Puntos: 0</div>
            </div>
            <div id="pregunta">Aquí va la pregunta</div>
            <div id="opciones">
                </div>
        </div>

        <div id="final" class="oculto">
            <h2>¡Juego Terminado!</h2>
            <div id="puntuacion-final">Has acertado 0 de 20</div>
            <button onclick="location.reload()">Reintentar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
