<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto XML - Quiz</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Quiz XML</h1>

    <select id="language">
        <option value="preguntas_es.xml">Español</option>
        <option value="preguntas_en.xml">English</option>
    </select>

    <div class="info">
        <span id="timer">⏱ 0s</span>
        <span id="score">⭐ 0</span>
    </div>

    <div id="card">
        <h2 id="question"></h2>
        <div id="answers"></div>
    </div>

    <div class="controls">
        <button onclick="nextQuestion()">Siguiente</button>
    </div>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
