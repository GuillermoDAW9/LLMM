<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor World - Guillermo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f4; }
        .navbar { background-color: #1a1a1a; }
        /* Carrusel */
        .carousel-item img { height: 60vh; object-fit: cover; filter: brightness(0.6); }
        .card-img-top { height: 250px; object-fit: cover; }
        section { padding: 50px 0; }
        .footer { background: #111; color: white; padding: 20px 0; text-align: center; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏎️ MOTOR WORLD</a>
        </div>
    </nav>

    <div id="slider" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/1.jpg" class="d-block w-100" alt="Foto 1">
                <div class="carousel-caption"><h2>Potencia</h2></div>
            </div>
            <div class="carousel-item">
                <img src="img/2.jpg" class="d-block w-100" alt="Foto 2">
                <div class="carousel-caption"><h2>Elegancia</h2></div>
            </div>
            <div class="carousel-item">
                <img src="img/3.jpg" class="d-block w-100" alt="Foto 3">
                <div class="carousel-caption"><h2>Velocidad</h2></div>
            </div>
        </div>
    </div>

    <section class="container" id="marcas">
        <h2 class="text-center mb-4">NUESTRAS MARCAS</h2>
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card shadow">
                    <img src="img/1.jpg" class="card-img-top">
                    <div class="card-body text-center"><h5>BMW</h5></div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card shadow">
                    <img src="img/2.jpg" class="card-img-top">
                    <div class="card-body text-center"><h5>MERCEDES</h5></div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card shadow">
                    <img src="img/3.jpg" class="card-img-top">
                    <div class="card-body text-center"><h5>AUDI</h5></div>
                </div>
            </div>
        </div>
    </section>

    <section class="bg-white" id="media">
        <div class="container text-center">
            <h2 class="mb-4">MULTIMEDIA</h2>
            <div class="row align-items-center">
                <div class="col-md-7">
                    <video controls class="w-100 rounded shadow">
                        <source src="video/game.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="col-md-5">
                    <h4>Escucha el Motor</h4>
                    <audio controls class="w-100 mt-3">
                        <source src="audio/music.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>Motor World &copy; 2026 - Guillermo DAW</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
