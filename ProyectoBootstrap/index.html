<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor World - Guillermo DAW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #1a1a1a; }
        /* Carrusel con rutas correctas a la carpeta img/ */
        .carousel-item img { height: 65vh; object-fit: cover; filter: brightness(0.6); }
        .card-img-top { height: 250px; object-fit: cover; }
        section { padding: 60px 0; }
        .titulo-seccion { border-bottom: 3px solid #0d6efd; display: inline-block; padding-bottom: 5px; margin-bottom: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏎️ MOTOR WORLD</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#marcas">Marcas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#media">Media</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="inicio" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/1.jpg" class="d-block w-100" alt="Coche 1">
                <div class="carousel-caption"><h3>Potencia Extrema</h3></div>
            </div>
            <div class="carousel-item">
                <img src="img/2.jpg" class="d-block w-100" alt="Coche 2">
                <div class="carousel-caption"><h3>Lujo Alemán</h3></div>
            </div>
            <div class="carousel-item">
                <img src="img/3.jpg" class="d-block w-100" alt="Coche 3">
                <div class="carousel-caption"><h3>Ingeniería Avanzada</h3></div>
            </div>
        </div>
    </div>

    <section id="marcas" class="container text-center">
        <h2 class="titulo-seccion">Nuestras Marcas</h2>
        <div class="row justify-content-center">
            <div class="col-md-4 mb-4">
                <div class="card shadow border-0">
                    <img src="img/1.jpg" class="card-img-top">
                    <div class="card-body"><h5>BMW</h5></div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow border-0">
                    <img src="img/2.jpg" class="card-img-top">
                    <div class="card-body"><h5>Mercedes</h5></div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow border-0">
                    <img src="img/3.jpg" class="card-img-top">
                    <div class="card-body"><h5>Audi</h5></div>
                </div>
            </div>
        </div>
    </section>

    <section id="media" class="bg-light text-center">
        <div class="container">
            <h2 class="titulo-seccion">Multimedia</h2>
            <div class="row align-items-center">
                <div class="col-md-7 mb-4">
                    <video controls class="w-100 rounded shadow">
                        <source src="video/game.mp4" type="video/mp4">
                        Tu navegador no soporta vídeo.
                    </video>
                </div>
                <div class="col-md-5">
                    <div class="p-4 bg-white shadow rounded">
                        <h4>Sonido Motor</h4>
                        <audio controls class="w-100 mt-3">
                            <source src="audio/music.mp3" type="audio/mpeg">
                            Tu navegador no soporta audio.
                        </audio>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
