<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor World - Guillermo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #1a1a1a; }
        /* Ajuste para que las fotos se vean grandes y no se corten mal */
        .carousel-item img { height: 70vh; object-fit: cover; filter: brightness(0.6); }
        .card-img-top { height: 250px; object-fit: cover; }
        section { padding: 60px 0; }
        .titulo-subrayado { border-bottom: 3px solid #007bff; display: inline-block; padding-bottom: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏎️ MOTOR WORLD</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#marcas">Marcas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#media">Media</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="inicio" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="1.jpg" class="d-block w-100" alt="Coche 1">
                <div class="carousel-caption">
                    <h2>Deportividad Extrema</h2>
                    <p>Siente la potencia en cada curva.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="2.jpg" class="d-block w-100" alt="Coche 2">
                <div class="carousel-caption">
                    <h2>Lujo y Confort</h2>
                    <p>Diseño alemán de alta gama.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="3.jpg" class="d-block w-100" alt="Coche 3">
                <div class="carousel-caption">
                    <h2>Ingeniería Avanzada</h2>
                    <p>El futuro de la conducción.</p>
                </div>
            </div>
        </div>
    </div>

    <section id="marcas" class="container text-center">
        <h2 class="mb-5 titulo-subrayado">NUESTRAS MARCAS</h2>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <img src="1.jpg" class="card-img-top" alt="BMW">
                    <div class="card-body"><h5>BMW</h5></div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <img src="2.jpg" class="card-img-top" alt="Mercedes">
                    <div class="card-body"><h5>Mercedes</h5></div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <img src="3.jpg" class="card-img-top" alt="Audi">
                    <div class="card-body"><h5>Audi</h5></div>
                </div>
            </div>
        </div>
    </section>

    <section id="media" class="bg-light">
        <div class="container text-center">
            <h2 class="mb-5 titulo-subrayado">MULTIMEDIA</h2>
            <div class="row align-items-center">
                <div class="col-md-7 mb-4">
                    <video controls class="w-100 rounded shadow">
                        <source src="video.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="col-md-5">
                    <h4>Sonido del Motor</h4>
                    <audio controls class="w-100 mt-3">
                        <source src="audio.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
