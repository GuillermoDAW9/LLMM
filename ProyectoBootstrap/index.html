<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor World - Guillermo DAW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #1a1a1a; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .carousel-item img { height: 70vh; object-fit: cover; filter: brightness(0.7); }
        .card-img-top { height: 250px; object-fit: cover; }
        section { padding: 80px 0; }
        .titulo-seccion { font-weight: bold; margin-bottom: 40px; text-transform: uppercase; border-bottom: 3px solid #0d6efd; display: inline-block; padding-bottom: 10px; }
        footer { background-color: #111; color: white; text-align: center; padding: 25px 0; margin-top: 50px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏎️ MOTOR WORLD</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#marcas">Marcas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#media">Media</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="inicio" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/1.jpg" class="d-block w-100" alt="Slider 1">
                <div class="carousel-caption">
                    <h2 class="display-4 fw-bold">Potencia Extrema</h2>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/2.jpg" class="d-block w-100" alt="Slider 2">
                <div class="carousel-caption">
                    <h2 class="display-4 fw-bold">Diseño Alemán</h2>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/3.jpg" class="d-block w-100" alt="Slider 3">
                <div class="carousel-caption">
                    <h2 class="display-4 fw-bold">Velocidad Máxima</h2>
                </div>
            </div>
        </div>
    </div>

    <section id="marcas" class="container text-center">
        <h2 class="titulo-seccion">Nuestras Marcas</h2>
        <div class="row mt-4 justify-content-center">
            <div class="col-md-4 mb-4">
                <div class="card shadow border-0">
                    <img src="img/bmw.jpg" class="card-img-top" alt="BMW">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">BMW</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow border-0">
                    <img src="img/mercedes.jpg" class="card-img-top" alt="Mercedes">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Mercedes-Benz</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow border-0">
                    <img src="img/audi.jpg" class="card-img-top" alt="Audi">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Audi</h5>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="media" class="bg-light text-center">
        <div class="container">
            <h2 class="titulo-seccion">Multimedia</h2>
            <div class="row align-items-center mt-5">
                <div class="col-lg-7 mb-4">
                    <div class="ratio ratio-16x9 shadow rounded bg-dark overflow-hidden">
                        <video controls>
                            <source src="video/videocoche.mp4" type="video/mp4">
                            Tu navegador no soporta el vídeo.
                        </video>
                    </div>
                </div>
                <div class="col-lg-5 mb-4">
                    <div class="p-5 bg-white shadow rounded">
                        <h4 class="mb-4">Sonido del Motor</h4>
                        <audio controls class="w-100">
                            <source src="audio/audiomotor.mp3" type="audio/mpeg">
                            Tu navegador no soporta el audio.
                        </audio>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>Motor World Project &copy; 2026 | Guillermo DAW</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
