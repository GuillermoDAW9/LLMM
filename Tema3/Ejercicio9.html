<!DOCTYPE html>
<html>
<head>
    <title>Temperature Converter</title>

    <script>

        
        function toCelsius(f) {
            return (5/9) * (f - 32);
        }

        
        function toFahrenheit(c) {
            return (9/5) * c + 32;
        }

      
        function convertToCelsius() {
            var f = parseFloat(document.getElementById("tbf").value);
            var c = toCelsius(f);
            document.getElementById("tbc").value = c.toFixed(2);
        }

       
        function convertToFahrenheit() {
            var c = parseFloat(document.getElementById("tbc").value);
            var f = toFahrenheit(c);
            document.getElementById("tbf").value = f.toFixed(2);
        }

    </script>
</head>

<body>

<h2>Temperature Converter</h2>

<p>Convert temperatures between Fahrenheit and Celsius:</p>

<label for="tbf">Fahrenheit: </label>
<input type="text" id="tbf" name="tbf">
<br><br>

<label for="tbc">Celsius: </label>
<input type="text" id="tbc" name="tbc">
<br><br>

<button type="button" onclick="convertToCelsius()">F → C</button>
<button type="button" onclick="convertToFahrenheit()">C → F</button>

</body>
</html>
