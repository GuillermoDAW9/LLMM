<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio 8 - setTimeout</title>
    <script>
        function mostrarMensaje() {
            alert("¡Han pasado 5 segundos! Este es tu mensaje.");
        }

        // Ejecutar la función después de 5 segundos (5000 ms)
        window.onload = function() {
            setTimeout(mostrarMensaje, 5000);
        };
    </script>
</head>
<body>

<h2>Mensaje con setTimeout</h2>
<p>Espera 5 segundos y aparecerá un mensaje automáticamente.</p>

</body>
</html>
