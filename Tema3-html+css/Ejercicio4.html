<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Tabla de multiplicar</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  label, input, button {
    font-size: 18px;
  }

  input {
    width: 80px;
    padding: 5px;
    margin-left: 10px;
    margin-right: 10px;
  }

  button {
    padding: 5px 15px;
    font-weight: bold;
  }

  table {
    margin-top: 20px;
    border-collapse: collapse;
    width: 250px;
  }

  th, td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
    background-color: #f0f8ff;
  }

  th {
    background-color: #4682b4;
    color: white;
  }
</style>
</head>
<body>

<h2>Generador de tabla de multiplicar</h2>

<label for="num">Introduce un número:</label>
<input type="number" id="num" min="1" max="100" value="5" />
<button onclick="generarTabla()">Generar tabla</button>

<div id="resultado"></div>

<script>
  function generarTabla() {
    const numero = parseInt(document.getElementById('num').value);
    if (isNaN(numero) || numero < 1) {
      alert("Por favor, introduce un número válido mayor que 0.");
      return;
    }

    let html = "<table><thead><tr><th>Multiplicación</th><th>Resultado</th></tr></thead><tbody>";
    
    for (let i = 1; i <= 10; i++) {
      html += `<tr><td>${numero} × ${i}</td><td>${numero * i}</td></tr>`;
    }
    html += "</tbody></table>";

    document.getElementById('resultado').innerHTML = html;
  }


  window.onload = generarTabla;
</script>

</body>
</html>
