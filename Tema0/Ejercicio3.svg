Es un formato de imagen basado en vectores que se describe utilizando XML.

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo SVG</title>
</head>
<body>

    <h1>Ejemplo de SVG</h1>
    <p>Este es un círculo SVG:</p>

    <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="40" fill="red" />
    </svg>

</body>
</html>
