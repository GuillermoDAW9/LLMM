<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School Timetable</title>
<style>
  table {
    border-collapse: collapse;
    width: 60%;
    text-align: center;
  }
  th, td {
    border: 1px solid black;
    padding: 10px;
  }
  th {
    background-color: #f0f0f0;
  }
  .break {
    background-color: #ffe4b5;
    font-weight: bold;
  }
</style>
</head>
<body>

<h2>My School Timetable</h2>

<table>
  <tr>
    <th>Time</th>
    <th>Subject</th>
  </tr>


  <tr>
    <td>08:00 – 10:00</td>
    <td rowspan="2">Mathematics</td>
  </tr>
  <tr>
    <td>08:00 – 10:00</td>
  </tr>

  
  <tr>
    <td>10:00 – 11:00</td>
    <td>English</td>
  </tr>


  <tr class="break">
    <td>11:00 – 11:30</td>
    <td>BREAK</td>
  </tr>


  <tr>
    <td>11:30 – 14:30</td>
    <td rowspan="3">Science</td>
  </tr>
  <tr>
    <td>11:30 – 14:30</td>
  </tr>
  <tr>
    <td>11:30 – 14:30</td>
  </tr>


  <tr>
    <td>14:30 – 15:30</td>
    <td>History</td>
  </tr>

</table>

</body>
</html>
