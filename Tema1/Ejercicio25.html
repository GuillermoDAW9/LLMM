<!DOCTYPE html>
<html>
<head>
    <title>Mi Primer Formulario Completo</title>
</head>
<body>

    <h1>Rellena tu CV</h1>

    <form method="post">
        
        <p>
            Nombre: <input type="text" name="nombre" maxlength="30"><br>
            Apellidos: <input type="text" name="apellidos" maxlength="80"><br>
            Contraseña: <input type="password" name="contrasena" maxlength="10"><br>
            DNI: <input type="text" name="dni" size="9"><br>
        </p>

        <p>
            Sexo: 
            <input type="radio" name="sexo" value="hombre" checked> Hombre 
            <input type="radio" name="sexo" value="mujer"> Mujer
        </p>
        
        <hr> <h2>Datos personales</h2>
        
        <p>
            Provincia: 
            <select name="provincia">
                <option value="" selected>- selecciona -</option>
                <option value="huelva">Huelva</option>
                <option value="madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
            </select>
        </p>
        
        <p>
            Fecha de nacimiento: 
            <input type="text" name="dia" size="2"> 
            <select name="mes">
                <option selected>Enero</option>
                <option>Febrero</option>
                <option>Marzo</option>
            </select>
            <input type="text" name="anio" size="4">
        </p>
        
        <h2>Temas de interés</h2>
        <p>
            <select name="temas" multiple size="5">
                <option>Administración de bases de datos</option>
                <option>Análisis y programación</option>
                <option>Arquitectura</option>
                <option>Calidad</option>
                <option>ERP, CRM, Business Intelligence</option>
            </select>
        </p>

        <hr> <p>
            Incluir mi foto: <input type="file" name="foto">
        </p>
        
        <p>
            <input type="checkbox" name="boletin" checked> Suscribirme al boletín de novedades
        </p>
        
        <p>
            <input type="submit" value="Guardar cambios">
            <input type="reset" value="Borrar los datos introducidos">
        </p>
        
    </form>

</body>
</html>
