<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 24 - Rellena tu CV</title>
</head>
<body>

    <h1>Rellena tu CV</h1>

    <form action="/procesar_formulario" method="post">
        
        <label for="nombre">Nombre</label><br>
        <input type="text" id="nombre" name="nombre" maxlength="30" required><br><br>

        <label for="apellidos">Apellidos</label><br>
        <input type="text" id="apellidos" name="apellidos" maxlength="80" required><br><br>
        
        <label for="contrasena">Contraseña</label><br>
        <input type="password" id="contrasena" name="contrasena" maxlength="10" required><br><br>
        
        <label for="dni">DNI</label><br>
        <input type="text" id="dni" name="dni" size="9"><br><br>
        
        <label>Sexo</label><br>
        <input type="radio" id="hombre" name="sexo" value="hombre" checked>
        <label for="hombre">Hombre</label><br>
        <input type="radio" id="mujer" name="sexo" value="mujer">
        <label for="mujer">Mujer</label><br><br>
        
        <label for="foto">Incluir mi foto</label><br>
        <input type="file" id="foto" name="foto"><br><br>
        
        <input type="checkbox" id="boletin" name="boletin" checked>
        <label for="boletin">Suscribirme al boletín de novedades</label><br><br>
        
        <button type="submit">Guardar cambios</button>
        <button type="reset">Borrar los datos introducidos</button>
        
    </form>

</body>
</html>
